{% extends "base.html" %}
{% block titulo %}Agregar compra{% endblock %}
{% block contenido %}
<h1>🛒 Agregar compra</h1>
<p class="ayuda">Para reponer un producto que ya existe. El stock sube solo al guardar.</p>

<form method="post" action="/compras/nueva" class="formulario" data-calculo-precio>
  <label>¿Qué producto compraste? <span class="obligatorio">*</span>
    <input type="search" placeholder="🔎 Escribí para buscar…" data-filtrar-select="#producto_id">
    <select name="producto_id" id="producto_id" required size="6" data-elegir-producto>
      {% for p in productos %}
        <option value="{{ p.id }}" data-proveedor="{{ p.proveedor }}" data-precio="{{ p.precio_venta }}"
                data-margen="{{ p.margen_pct }}">{{ p.nombre_interno }} ({{ p.codigo }}) — stock {{ p.stock|cant }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Proveedor
    <input name="proveedor" id="proveedor" list="lista-proveedores">
    <datalist id="lista-proveedores">
      {% for pr in proveedores %}<option value="{{ pr.nombre }}">{% endfor %}
    </datalist>
  </label>
  <div class="dos-columnas">
    <label>Fecha de compra
      <input type="date" name="fecha" value="{{ hoy }}">
    </label>
    <label>N° de factura
      <input name="nro_factura" placeholder="001-001-0000000">
    </label>
  </div>
  <div class="dos-columnas">
    <label>Cantidad <span class="obligatorio">*</span>
      <input name="cantidad" id="cantidad" inputmode="decimal" required>
    </label>
    <label>Costo total <span class="obligatorio">*</span>
      <input name="costo_total" id="costo_total" inputmode="numeric" data-dinero required>
    </label>
  </div>
  <div class="calculado">Precio por unidad: <b id="precio_unitario">—</b></div>
  <div class="dos-columnas">
    <label>Ganancia %
      <input id="margen_pct" inputmode="decimal" value="40">
    </label>
    <label>Nuevo precio de venta (dejá vacío para no cambiarlo)
      <input name="precio_venta" id="precio_venta" inputmode="numeric" data-dinero data-opcional>
    </label>
  </div>

  <div class="botones">
    <a class="boton grande" href="/compras">✖ Cancelar</a>
    <button class="boton grande principal" type="submit">💾 Guardar</button>
  </div>
</form>
{% endblock %}
